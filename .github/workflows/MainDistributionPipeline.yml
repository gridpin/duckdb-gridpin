#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

# Since 2026-10-20 the community catalogue builds two lines from one descriptor: `repo.ref` against DuckDB v2.0.0
# (the default) and `repo.variegata` against v1.5.6. Both jobs below pass the descriptor's platform fields
# (excluded_platforms, opt_in_platforms) and build the full matrix the catalogue deploys after a merge.
jobs:
  duckdb-stable-build:
    # CMake builds the Rust static library before linking the C++ extension.
    # The 1.5 line (catalogue `variegata`) on the DuckDB version the release ZIP is built for.
    name: Build C++ extension and Rust engine (DuckDB 1.5, catalogue variegata)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: gridpin_ext
      extra_toolchains: rust;python3
      # windows_amd64_mingw: Rust staticlib (gnu target) linked by the rtools gcc is unproven for the C++ layout —
      # mirror pipeline 38216592299 (2026-10-12) failed there while MSVC windows_amd64 is proven by the release CI;
      # the catalogue's Rust-backed extensions exclude it too (ANSWERS §114).
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl;windows_amd64_mingw'
      # osx_amd64 is a default platform on 1.5 tools; the opt-in only repeats the descriptor.
      opt_in_archs: 'osx_amd64'
      reduced_ci_mode: disabled

  duckdb-ref-build:
    # The catalogue's default build (build.yml, 2026-10-20): _extension_distribution.yml@v2.0-cyanoptera with
    # ci-tools v2.0-cyanoptera, DuckDB v2.0.0 checked out at commit d54cbbe3 (no v2.0.0 tag yet; the catalogue
    # passes the commit until it re-adds duckdb_tag) and vcpkg 2026.06.24. This job repeats exactly that build,
    # so the 2.0 leg is green here before a new `ref` is proposed to the catalogue.
    # Two differences from 1.5 tools: osx_amd64 builds only when opted in (ci-tools e9e8edcc, 2026-10-15), and
    # reduced_ci_mode `auto` drops every platform except linux_amd64 and windows_amd64 on pull_request events —
    # the catalogue deploys the full matrix, so this job disables the reduction.
    name: Build against DuckDB 2.0 (catalogue ref)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      duckdb_commit: d54cbbe3df17e8e5ce68312f483b4155836112aa
      ci_tools_version: v2.0-cyanoptera
      vcpkg_commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
      extension_name: gridpin_ext
      extra_toolchains: rust;python3
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl;windows_amd64_mingw'
      opt_in_archs: 'osx_amd64'
      reduced_ci_mode: disabled

  sql-tests-ran:
    # sqllogictest skips a whole test file when `require gridpin_ext` cannot load the extension, and the step that
    # ran it stays green (run 39611788181, 2026-10-21: "All tests were skipped" on every platform, the extension was
    # built but not linked). This job reads the logs of the jobs that run tests and fails unless each passed real
    # assertions: linux_amd64, osx_arm64 and windows_amd64 of both lines.
    name: SQL tests really ran
    needs: [duckdb-stable-build, duckdb-ref-build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: .github
      - name: Check the test output of every tested platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/check_tests_ran.py
