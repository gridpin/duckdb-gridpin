[package]
name = "gridpin_ext"
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
gridpin = { git = "https://github.com/gridpin/gridpin", rev = "755d9156cb9121cb93cb06a675fb0325977c776e" }
serde = "1"
serde_json = "1"

[features]
# extra answer fields: on with the engine release that has them (gridpin-ffi turns it on by default)
extras = []

[profile.release]
lto = "thin"
