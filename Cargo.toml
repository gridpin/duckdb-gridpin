[package]
name = "gridpin_ext"
version = "0.10.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
gridpin = { git = "https://github.com/gridpin/gridpin", rev = "490fc5822f40cf68dd5b48a3a5047132658b7903" }
serde = "1"
serde_json = "1"

[features]
# extra answer fields: on with the engine release that has them (gridpin-ffi turns it on by default)
extras = []

[profile.release]
lto = "thin"
